<html>
  <head>
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <title>P-1</title>
  </head>
  <script>
    AFRAME.registerComponent('scale-on-mouseenter', {
      schema: {
        to: {default: {4, 4, 4}, type='vec3'}
      }
      init: function() {
        var el = this.el
        var data = this.data
        el.addEventListener('mouseenter', function () {
          //On Mouse Enter
          el.object3D.scale.copy(data.to);
        });
      }
    });
  </script>
  <body>
    <a-scene>

      <a-camera>
        <a-cursor>
          <a-entity oculus-go-controls></a-entity>
        </a-cursor>
      </a-camera>
      
      <a-entity id="scene1" position="0 0 0">
        <!-- Scnene 1 -->
        <a-box id="start" color="red" position="0 2 -5" rotation="0 45 45" scale="2 2 2" scale-on-mouseenter></a-box>
      </a-entity>

      <a-entity id="scene2" position="0 0 0">
        <!-- Scene 2 -->
      </a-entity>
      
    </a-scene>
  </body>
  
  <script>

  </script>
</html>
