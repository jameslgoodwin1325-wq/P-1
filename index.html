<html>
  <head>
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <title>P-1</title>
  </head>

  <body>
    <a-scene>
      
      <a-entity id="scene1" position="0 0 0">
        <!-- Scnene 1 -->
        <a-box id="start" color="red" position="0 2 -5" rotation="0 45 45" scale="2 2 2"></a-box>
      </a-entity>

      <a-entity id="scene2" position="0 0 0">
        <!-- Scene 2 -->
      </a-entity>
      
    </a-scene>
  </body>
  
  <script>
    var button = document.querySelector("start");
    button.addEventListener('mouseenter', function () {
      //
      button.setAttribute('scale', {x: 4, y: 4, z:4})
    });
  </script>
</html>
