<html>
  <head>
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <title>P-1</title>
  </head>
  <script>
    //Movement
      AFRAME.registerComponent('move-with-arrows', {
        schema: {
          speed: { default: 2 },              // meters per second
          controller: { type: 'selector' },    // entity that emits axismove
          go: { default: 1 }
        },
        init: function () {
            if (this.data.go == 1) {
              this.axis = { x: 0, y: 0 };
              var src = this.data.controller || this.el;
              var self = this;
              src.addEventListener('axismove', function (evt) {
                self.axis.x = evt.detail.axis[0];
                self.axis.y = evt.detail.axis[1];
              });
            } else {
              //
            }
          // Stop when thumb leaves the touchpad
          src.addEventListener('trackpadtouchend', function () {
            self.axis.x = 0; self.axis.y = 0;
          });
        },
        tick: function (time, timeDelta) {
          if (!timeDelta) return;
          var x = this.axis.x, y = this.axis.y;
          if (Math.abs(x) < 0.1 && Math.abs(y) < 0.1) return; // dead zone

          var d = this.data.speed * (timeDelta / 1000);
          var yaw = this.el.sceneEl.camera.el.object3D.rotation.y;
          var sin = Math.sin(yaw), cos = Math.cos(yaw);

          var p = this.el.object3D.position;  // mutate directly, no setAttribute
          p.x += (x * cos + y * sin) * d;
          p.z += (y * cos - x * sin) * d;
        }
      });
  </script>
    <!-- TURN OFF THE LIGHTS IN THE BASEMENT -->
  <script>
    function showScene(n) {
      document.querySelector('#scene1').setAttribute('visible', n === 1);
      document.querySelector('#scene2').setAttribute('visible', n === 2);
    }

    AFRAME.registerComponent('click-to-start', {
      init: function () {
        var el = this.el;
        el.addEventListener('click', function () {
          showScene(2);
          el.classList.remove('clickable'); // hidden objects can still be clicked
        });
      }
    });
  </script>

  <script>
    AFRAME.registerComponent('menu', {
      init: function() {
        var el = this.el;
        el.addEventListener('trackpaddown', function() {
          //If Trackpad Down

        }); 
      }
    });
  </script>
  <body>
    <a-scene>
      <a-assets>
        <a-asset-item id="star" src="./8ptFidgetStar.glb"></a-asset-item>
        <a-asset-item id="starship" src="./Starship.glb"></a-asset-item>
        <a-asset-item id="portal_logo" src="./PortalLogo.glb"></a-asset-item>
      </a-assets>
      
      <a-entity id="rig" position="0 0 0" move-with-arrows="controller: #rightHand; speed: 4; go: 1;">
        <a-camera id="camera" wasd-controls="enabled: true"
                  cursor="rayOrigin: mouse"
                  raycaster="objects: .clickable"></a-camera>

        <a-entity menu id="rightHand" laser-controls="hand: right"
                  raycaster="objects: .clickable; far: 20"
                  line="color: #00e5ff; opacity: 0.8"></a-entity>
        <a-entity id="menu"></a-entity>
      </a-entity>
      
      <a-entity id="scene1" visible="true" position="0 0 0">
        <!-- Scnene 1 -->
        <a-box id="start" click-to-start class="clickable" color="white" position="0 2 -5" rotation="0 45 45" scale="3 3 3" 
          animation__enter="property: scale; to: 4 4 4; dur: 300; startEvents: mouseenter"
           animation__leave="property: scale; to: 3 3 3; dur: 300; startEvents: mouseleave"></a-box>
        <a-sky color='#000'></a-sky>
      </a-entity>

      <a-entity id="scene2" visible="false" position="0 0 0">
        <!-- Scene 2 -->
        <a-sky color="#00B"></a-sky>
        <a-plane  position="0 0 0" rotation="-90 0 0" width="100" height="100" color="#90EE90"></a-plane>
        <a-entity gltf-model="#star" position="10 0 10" scale="0.05 0.05 0.05"></a-entity>
        <a-entity gltf-model="#starship" position="7 0 -8" scale="0.05 0.05 0.05"></a-entity>
        <a-entity gltf-model="#portal_logo" rotation="0 0 90" position="0 3 -5" scale="0.05 0.05 0.05"
          animation="property: position; to: 0 3.5 0; dir: alternate; dur: 3000; loop: true; easing: easeInOutSine;"></a-entity>
      </a-entity>
      
    </a-scene>
  </body>
  
  <script>

  </script>
</html>
